name: Test Docker Image

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute test version
        id: vars
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}+g${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sabr:test
          build-args: |
            SOURCE_DIR=.
            SABR_VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify installed source and CLI
        env:
          EXPECTED_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          docker run --rm --entrypoint python --env EXPECTED_VERSION sabr:test \
            -c 'import importlib.metadata as m, os, sabr; assert m.version("sabr-kit") == os.environ["EXPECTED_VERSION"]'
          docker run --rm sabr:test --help

      - name: Run a containerized renumbering smoke test
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/tests/data,target=/data,readonly" \
            sabr:test \
            -i /data/1bjm_A.pdb -c A -o /tmp/numbered.pdb
