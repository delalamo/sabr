name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: JAX_PLATFORMS=cpu pytest --cov=sabr --cov-report=term-missing
      - run: pre-commit run --all-files

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/sabr-wheel-test
      - run: /tmp/sabr-wheel-test/bin/pip install dist/*.whl
      - run: /tmp/sabr-wheel-test/bin/python -c "import sabr"
      - run: /tmp/sabr-wheel-test/bin/sabr --help
      - run: /tmp/sabr-wheel-test/bin/sabr --version
