name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt build
      - run: python -m build
      - run: python -m venv /tmp/sabr-wheel-test
      - run: /tmp/sabr-wheel-test/bin/pip install -c constraints.txt dist/*.whl
      - run: /tmp/sabr-wheel-test/bin/python -c "import sabr"
      - run: /tmp/sabr-wheel-test/bin/sabr --help
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
