[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "sabr-kit"
dynamic = ["version"]
description = "Structure-based Antibody Renumbering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
  { name = "Diego del Alamo" },
]

dependencies = [
  "biopython>=1.85,<2",
  "click>=8.1,<9",
  "gemmi>=0.7,<1",
  "jax>=0.4.35,<0.11",
  "jaxlib>=0.4.35,<0.11",
  "numpy>=2.0,<3",
  "dm-haiku>=0.0.12,<0.1"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/delalamo/sabr"
Issues = "https://github.com/delalamo/sabr/issues"

[project.scripts]
sabr = "sabr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sabr"]

[tool.hatch.build]
include = [
  "src/sabr/**",
  "README.md",
  "LICENSE"
]

[tool.hatch.version]
source = "vcs"

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
